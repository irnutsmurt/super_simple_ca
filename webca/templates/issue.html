{% extends "base.html" %}
{% block title %}Issue certificate · SuperSimpleCA{% endblock %}
{% block content %}
<div class="card">
  <h1>Issue certificate</h1>
  <form method="post" class="stack form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="full">Common Name
      <input name="common_name" value="{{ form.common_name or '' }}" required autofocus
             placeholder="e.g. jellyfin.example.com">
    </label>

    <label>Type
      <select name="cert_type">
        <option value="server" {{ 'selected' if form.cert_type != 'client' }}>Server (serverAuth)</option>
        <option value="client" {{ 'selected' if form.cert_type == 'client' }}>Client (clientAuth)</option>
      </select>
    </label>
    <label>Validity (days)
      <input name="validity_days" type="number" min="1"
             value="{{ form.validity_days or d.default_validity_days }}">
    </label>
    <label>Key type
      <select name="key_spec">
        {% for val, label in (key_specs or {'rsa2048':'RSA 2048'}).items() %}
        <option value="{{ val }}" {{ 'selected' if form.key_spec == val or (not form.key_spec and val=='rsa2048') }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="full">Subject Alternative Names
      <input name="sans" value="{{ form.sans or '' }}"
             placeholder="jellyfin.example.com, 192.168.1.10  (DNS:/IP: added automatically)">
      <small class="muted">Comma or space separated. Bare hostnames become DNS:, bare IPs become IP:.
        Server certs default to DNS:&lt;common name&gt; if left blank.</small>
    </label>

    <fieldset class="full">
      <legend>Distinguished name (optional)</legend>
      <div class="form-grid">
        <label>Country<input name="country" value="{{ form.country or d.country }}"></label>
        <label>State<input name="state" value="{{ form.state or d.state }}"></label>
        <label>Locality<input name="locality" value="{{ form.locality or d.locality }}"></label>
        <label>Organization<input name="organization" value="{{ form.organization or d.organization }}"></label>
        <label>Org. Unit<input name="organizational_unit" value="{{ form.organizational_unit or d.organizational_unit }}"></label>
        <label>Email<input name="email" value="{{ form.email or d.email }}"></label>
      </div>
    </fieldset>

    {% if duplicate %}
    <label class="check full" style="background:var(--warn-bg);padding:.6rem .8rem;border-radius:8px">
      <input type="checkbox" name="confirm_duplicate" value="yes">
      Yes, replace the existing certificate’s files for “{{ duplicate.common_name }}”
      (serial {{ duplicate.serial }}). Consider revoking the old one afterward if it’s no longer used.
    </label>
    {% endif %}

    <div class="full">
      <button class="btn btn-primary">Issue certificate</button>
      <a class="linkbtn" href="{{ url_for('dashboard') }}">cancel</a>
    </div>
  </form>
</div>
{% endblock %}
